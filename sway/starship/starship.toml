add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$character\
"""

right_format = """
$cmd_duration\
$status\
$localip\
"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[directory]
style = "39"
truncate_to_repo = false
read_only = "  "
read_only_style = "red"
truncation_symbol = "…/"
repo_root_style = "bold cyan"

[git_branch]
symbol = ""
style = "bold green"
format = "[$symbol$branch]($style)"

[git_status]
format = " ([$all_status$ahead_behind]($style))"
style = "yellow"
conflicted = "[~$count](red) "
ahead = "[⇡$count](green)"
behind = "[⇣$count](green)"
diverged = "[⇡${ahead_count}⇣${behind_count}](green)"
untracked = "[?$count](blue) "
modified = "[!$count](yellow) "
staged = "[+$count](yellow) "
stashed = "[*$count](green) "

[cmd_duration]
min_time = 3_000
format = "[$duration](color 101) "

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = " "
style = "bold red"

[localip]
disabled = false
ssh_only = false
style = "cyan"
